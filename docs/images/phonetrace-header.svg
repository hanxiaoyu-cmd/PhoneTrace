<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
  <title id="title">PhoneTrace · 帧迹</title>
  <desc id="desc">Android 游戏性能记录。深色背景与青蓝色装饰波形，波形不代表实测数据。</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#091524"/>
      <stop offset="1" stop-color="#102439"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" x2="1">
      <stop offset="0" stop-color="#46dbce" stop-opacity=".12"/>
      <stop offset=".5" stop-color="#46dbce"/>
      <stop offset="1" stop-color="#60b4fa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#426078" stroke-opacity=".13"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1278" height="298" rx="20" fill="url(#background)" stroke="#234056"/>
  <rect x="660" y="32" width="564" height="232" fill="url(#grid)"/>
  <path d="M57 47h28" stroke="#46dbce" stroke-width="3"/>
  <text x="99" y="52" fill="#8eaabe" font-family="Consolas,monospace" font-size="13" letter-spacing="2.6">ANDROID PERFORMANCE RECORDER</text>
  <text x="54" y="142" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="68" font-weight="700" letter-spacing="-2">Phone<tspan fill="#56dcd1">Trace</tspan></text>
  <text x="58" y="188" fill="#b4cada" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="22" letter-spacing="2">让每一帧，都有迹可循。</text>
  <text x="59" y="252" fill="#7895ab" font-family="Consolas,monospace" font-size="12" letter-spacing="1.5">WINDOWS x64 <tspan fill="#35536a"> / </tspan> LOCAL DATA <tspan fill="#35536a"> / </tspan> OPEN SOURCE</text>
  <text x="752" y="70" fill="#7294ae" font-family="Consolas,monospace" font-size="11" letter-spacing="2">FPS <tspan fill="#38566d"> / </tspan> POWER <tspan fill="#38566d"> / </tspan> FRAME TIME</text>
  <path d="M708 198H1230" fill="none" stroke="#284457" stroke-dasharray="3 7"/>
  <path d="M694 179h42l25-8 29 11 27-19 30 10 30-45 32 30 31-10 29 13 26-59 23 83 27-38 32 6 28-13 26 16h64" fill="none" stroke="url(#trace)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="1195" cy="156" r="5" fill="#60b4fa"/>
  <circle cx="1195" cy="156" r="13" fill="none" stroke="#60b4fa" stroke-opacity=".25"/>
  <text x="816" y="248" fill="#65859e" font-family="Consolas,monospace" font-size="11" letter-spacing="2">CAPTURE · REVIEW · EXPORT</text>
</svg>
